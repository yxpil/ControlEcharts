  <symbol id="i-expand" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5"/></g></symbol>

  <symbol id="i-sparkles" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.7 4.6L18.3 9.3l-4.6 1.7L12 15.6l-1.7-4.6L5.7 9.3l4.6-1.7z"/><path d="M18.5 15l.8 2.1 2.2.8-2.2.8-.8 2.1-.8-2.1-2.2-.8 2.2-.8z"/></g></symbol>

<!-- ===================== 顶部栏 ===================== -->
<header id="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" width="18" height="18"><use href="#i-chart"/></svg>
    </span>
    <div class="brand-text">
      <strong>ControlEcharts</strong>
      <small>统计图表制作工作台</small>
    </div>
  </div>

  <div class="topbar-tools">
    <button class="btn btn-ghost" id="btn-open-data" title="导入 CSV / JSON 文件">
      <svg viewBox="0 0 24 24"><use href="#i-upload"/></svg><span>导入文件</span>
    </button>
    <button class="btn btn-ghost" id="btn-paste-data" title="粘贴文本数据">
      <svg viewBox="0 0 24 24"><use href="#i-table"/></svg><span>粘贴数据</span>
    </button>
    <button class="btn btn-ghost" id="btn-samples" title="载入示例数据">
      <svg viewBox="0 0 24 24"><use href="#i-sparkles"/></svg><span>示例数据</span>
    </button>
    <span class="sep"></span>
    <div class="menu-wrap">
      <button class="btn btn-ghost" id="btn-export" title="导出图表">
        <svg viewBox="0 0 24 24"><use href="#i-download"/></svg><span>导出</span>
      </button>
      <div class="menu" id="menu-export">
        <button data-export="png"><svg viewBox="0 0 24 24"><use href="#i-image"/></svg>PNG 图片</button>
        <button data-export="svg"><svg viewBox="0 0 24 24"><use href="#i-shape"/></svg>SVG 矢量图</button>
        <button data-export="csv"><svg viewBox="0 0 24 24"><use href="#i-table"/></svg>数据 CSV</button>
        <button data-export="json"><svg viewBox="0 0 24 24"><use href="#i-save"/></svg>工程 JSON</button>
        <div class="menu-sep"></div>
        <button data-export="code-html"><svg viewBox="0 0 24 24"><use href="#i-code"/></svg>独立 HTML</button>
        <button data-export="code-option"><svg viewBox="0 0 24 24"><use href="#i-code"/></svg>ECharts option</button>
        <button data-export="copy-option"><svg viewBox="0 0 24 24"><use href="#i-copy"/></svg>复制 option</button>
      </div>
    </div>
    <button class="btn btn-ghost" id="btn-project-open" title="打开工程 JSON">
      <svg viewBox="0 0 24 24"><use href="#i-folder"/></svg><span>打开工程</span>
    </button>
    <span class="sep"></span>
    <button class="btn btn-ghost icon-only" id="btn-theme" title="切换界面主题">
      <svg viewBox="0 0 24 24"><use href="#i-moon"/></svg>
    </button>
    <button class="btn btn-ghost icon-only" id="btn-github" title="在 GitHub 上查看">
      <svg viewBox="0 0 24 24"><use href="#i-github"/></svg>
    </button>
  </div>
</header>

<!-- ===================== 主体 ===================== -->
<div id="shell">

  <!-- 左栏 -->
  <aside id="left-panel" class="side-panel">
    <div class="side-tabs">
      <button class="side-tab active" data-side="types">
        <svg viewBox="0 0 24 24"><use href="#i-grid"/></svg><span>图表类型</span>
      </button>
      <button class="side-tab" data-side="palette">
        <svg viewBox="0 0 24 24"><use href="#i-palette"/></svg><span>配色方案</span>
      </button>
    </div>

    <div class="side-body">
      <!-- 图表类型 -->
      <section class="side-pane active" data-pane="types">
        <div class="pane-search">
          <svg viewBox="0 0 24 24"><use href="#i-zoom-in"/></svg>
          <input type="search" id="type-search" placeholder="搜索图表类型">
        </div>
        <div id="chart-types"></div>
      </section>

      <!-- 配色 -->
      <section class="side-pane" data-pane="palette">
        <div class="pane-block">
          <div class="pane-title">色彩模式</div>
          <div class="seg-toggle" id="color-mode">
            <button class="active" data-mode="mono">单色</button>
            <button data-mode="multi">多色</button>
            <button data-mode="custom">自定义</button>
          </div>
        </div>

        <div class="pane-block" data-colorpanel="mono">
          <div class="pane-title">基础色</div>
          <div class="swatch-row" id="mono-bases"></div>
          <label class="field-label" style="margin-top:14px">色阶分布
            <select id="mono-mode" class="input select">
              <option value="shade">深色向浅色渐变（推荐）</option>
              <option value="dark">整体偏深</option>
              <option value="light">整体偏浅</option>
              <option value="vivid">高饱和亮彩</option>
              <option value="grey">灰阶单色</option>
            </select>
          </label>
          <label class="field-label" style="margin-top:10px">单色渐变填充
            <span class="switch"><input type="checkbox" id="mono-gradient"><i></i></span>
          </label>
          <div class="pane-hint">单色模式会基于所选基础色自动生成与数据项数量相等的色阶，适合强调趋势而非分类。</div>
        </div>

        <div class="pane-block hidden" data-colorpanel="multi">
          <div class="pane-title">多色方案</div>
          <div id="multi-list" class="palette-list"></div>
          <label class="field-label" style="margin-top:14px">序列重复模式
            <select id="multi-repeat" class="input select">
              <option value="cycle">循环取色</option>
              <option value="shuffle">插值扩散</option>
            </select>
          </label>
        </div>

        <div class="pane-block hidden" data-colorpanel="custom">
          <div class="pane-title">自定义颜色序列</div>
          <div id="custom-colors" class="custom-colors"></div>
          <div class="row-actions">
            <button class="btn btn-soft btn-sm" id="btn-add-color">
              <svg viewBox="0 0 24 24"><use href="#i-plus"/></svg><span>添加颜色</span>
            </button>
            <button class="btn btn-soft btn-sm" id="btn-clear-colors">
              <svg viewBox="0 0 24 24"><use href="#i-trash"/></svg><span>清空</span>
            </button>
          </div>
        </div>

        <div class="pane-block">
          <div class="pane-title">色彩微调</div>
          <label class="field-label">不透明度 <b id="opacity-val">100%</b>
            <input type="range" id="color-opacity" min="20" max="100" value="100" class="range">
          </label>
          <label class="field-label">色彩随机扰动 <b id="jitter-val">0</b>
            <input type="range" id="color-jitter" min="0" max="40" value="0" class="range">
          </label>
          <label class="field-label" style="margin-top:10px">图表背景
            <select id="chart-bg" class="input select">
              <option value="transparent">透明</option>
              <option value="#ffffff">纯白</option>
              <option value="#0b1120">深空</option>
              <option value="#f8fafc">浅灰</option>
              <option value="#f1f5f9">雾灰</option>
            </select>
          </label>
        </div>
      </section>
    </div>
  </aside>

  <!-- 中栏 -->
  <main id="center">

    <div id="chart-bar">
      <div class="chart-bar-left">
        <span class="chart-badge" id="chart-badge">柱状图</span>
        <input type="text" id="quick-title" class="input quick-title" placeholder="图表标题">
        <span class="chart-meta" id="chart-meta"></span>
      </div>
      <div class="chart-bar-right">
        <button class="chip" id="chip-svg" data-toggle="svgRenderer" title="SVG 矢量渲染器">
          <svg viewBox="0 0 24 24"><use href="#i-shape"/></svg>SVG
        </button>
        <button class="chip active" id="chip-label" data-toggle="labelShow" title="显示数据标签">数值标签</button>
        <button class="chip" id="chip-smooth" data-toggle="smooth" title="平滑曲线">平滑</button>
        <button class="chip" id="chip-stack" data-toggle="stack" title="堆叠">堆叠</button>
        <button class="chip" id="chip-legend" data-toggle="legendShow" title="图例">图例</button>
        <button class="chip" id="chip-zoom" data-toggle="dataZoom" title="缩放">缩放</button>
        <button class="chip" id="chip-toolbox" data-toggle="toolbox" title="工具盒">工具盒</button>
        <span class="chip-sep"></span>
        <button class="chip icon-only" id="btn-expand" title="全屏查看">
          <svg viewBox="0 0 24 24"><use href="#i-expand"/></svg>
        </button>
        <button class="chip icon-only" id="btn-zoom-out" title="缩小">
          <svg viewBox="0 0 24 24"><use href="#i-zoom-out"/></svg>
        </button>
        <button class="chip icon-only" id="btn-zoom-in" title="放大">
          <svg viewBox="0 0 24 24"><use href="#i-zoom-in"/></svg>
        </button>
        <button class="chip icon-only" id="btn-reset" title="重置图表">
          <svg viewBox="0 0 24 24"><use href="#i-refresh"/></svg>
        </button>
      </div>
    </div>

    <div id="chart-stage">
      <div id="chart"></div>
      <div id="drop-hint">
        <svg viewBox="0 0 24 24"><use href="#i-drop"/></svg>
        <strong>松开以导入数据文件</strong>
        <small>支持 .csv / .tsv / .txt / .json</small>
      </div>
      <div id="chart-empty" class="hidden">
        <svg viewBox="0 0 24 24"><use href="#i-chart"/></svg>
        <strong>暂无数据</strong>
        <small>在下方表格中录入，或导入 CSV 文件</small>
      </div>
    </div>

    <div id="data-dock">
      <div class="dock-head">
        <button class="dock-toggle" id="dock-toggle">
          <svg viewBox="0 0 24 24"><use href="#i-chevron"/></svg>
          <span>数据编辑器</span>
        </button>
        <div class="dock-meta">
          <span id="data-stat">0 行 x 0 列</span>
        </div>
        <div class="dock-tools">
          <button class="btn btn-soft btn-sm" id="btn-add-row">
            <svg viewBox="0 0 24 24"><use href="#i-plus"/></svg><span>加行</span>
          </button>
          <button class="btn btn-soft btn-sm" id="btn-add-col">
            <svg viewBox="0 0 24 24"><use href="#i-plus"/></svg><span>加列</span>
          </button>
          <button class="btn btn-soft btn-sm" id="btn-transpose">
            <svg viewBox="0 0 24 24"><use href="#i-sort"/></svg><span>转置</span>
          </button>
          <button class="btn btn-soft btn-sm" id="btn-clear-data">
            <svg viewBox="0 0 24 24"><use href="#i-trash"/></svg><span>清空</span>
          </button>
        </div>
      </div>
      <div class="dock-body">
        <div class="table-scroll">
          <table id="data-table"></table>
        </div>
      </div>
    </div>

  </main>

  <!-- 右栏 -->
  <aside id="right-panel" class="side-panel">
    <div class="side-head">
      <svg viewBox="0 0 24 24"><use href="#i-settings"/></svg>
      <span>图表配置</span>
      <button class="btn btn-ghost btn-sm" id="btn-reset-config">恢复默认</button>
    </div>
    <div class="side-body" id="config-panel"></div>
  </aside>

</div>

<!-- ===================== 模态框 ===================== -->
<div class="modal" id="modal-paste">
  <div class="modal-card wide">
    <div class="modal-head">
      <strong>粘贴 / 编辑文本数据</strong>
      <button class="btn btn-ghost icon-only" data-close><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="modal-row">
        <label class="field-label" style="flex:1">分隔符
          <select id="paste-delim" class="input select">
            <option value="auto">自动识别</option>
            <option value=",">逗号 ,</option>
            <option value=";">分号 ;</option>
            <option value="\t">制表符 Tab</option>
            <option value="|">竖线 |</option>
            <option value=" ">空格</option>
          </select>
        </label>
        <label class="field-label" style="flex:1">首行为表头
          <span class="switch"><input type="checkbox" id="paste-header" checked><i></i></span>
        </label>
      </div>
      <textarea id="paste-area" class="input textarea" spellcheck="false" placeholder="类别,系列A,系列B
一月,120,200
二月,180,140
三月,150,260"></textarea>
      <div class="modal-note">支持从 Excel / WPS / Google Sheets 直接复制粘贴，也支持 CSV、TSV、分号与竖线分隔的纯文本。</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>取消</button>
      <button class="btn btn-primary" id="btn-paste-apply">
        <svg viewBox="0 0 24 24"><use href="#i-check"/></svg><span>导入数据</span>
      </button>
    </div>
  </div>
</div>

<div class="modal" id="modal-sample">
  <div class="modal-card">
    <div class="modal-head">
      <strong>示例数据集</strong>
      <button class="btn btn-ghost icon-only" data-close><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </div>
    <div class="modal-body">
      <div id="sample-list" class="sample-list"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal-code">
  <div class="modal-card wide">
    <div class="modal-head">
      <strong id="code-title">ECharts 配置代码</strong>
      <div class="modal-tabs">
        <button class="active" data-code="option">option</button>
        <button data-code="html">独立 HTML</button>
      </div>
      <button class="btn btn-ghost icon-only" data-close><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </div>
    <div class="modal-body">
      <pre id="code-out" class="code-out"></pre>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>关闭</button>
      <button class="btn btn-primary" id="btn-copy-code">
        <svg viewBox="0 0 24 24"><use href="#i-copy"/></svg><span>复制到剪贴板</span>
      </button>
      <button class="btn btn-soft" id="btn-download-code">
        <svg viewBox="0 0 24 24"><use href="#i-download"/></svg><span>下载文件</span>
      </button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<input type="file" id="file-input" accept=".csv,.tsv,.txt,.json,.xls,.xlsx" hidden>
<input type="file" id="project-input" accept=".json" hidden>

<script src="vendor/echarts.min.js"></script>
<script src="js/palettes.js"></script>
<script src="js/data.js"></script>
<script src="js/chart-core.js"></script>
<script src="js/charts-a.js"></script>
<script src="js/charts-b.js"></script>
<script src="js/charts-c.js"></script>
<script src="js/app.js"></script>
<script src="js/app-ui.js"></script>
</body>
</html>
